<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project plan — git graph</title>
<style>
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#faf9f5;color:#1f1e1b}
  @media (prefers-color-scheme:dark){body{background:#191815;color:#f3f1ea}}
  .wrap{max-width:1280px;margin:0 auto;padding:22px 20px 40px;overflow-x:auto}
  h1{font-size:20px;font-weight:600;margin:0 0 14px}
  .err{white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;color:#b91c1c}
  pre.mermaid{margin:0}
</style>
</head>
<body>
<div class="wrap">
  <h1>Project plan — árbol de progreso</h1>
  <pre class="mermaid">
__MERMAID_CODE__
  </pre>
</div>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script>
  var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  mermaid.initialize({ startOnLoad: true, theme: dark ? 'dark' : 'default', securityLevel: 'loose', gitGraph: { mainBranchName: 'main', showCommitLabel: true, rotateCommitLabel: true } });
  window.addEventListener('error', function (e) {
    var p = document.querySelector('.wrap');
    if (p) { var d = document.createElement('div'); d.className = 'err'; d.textContent = 'Mermaid: ' + (e.message || e); p.appendChild(d); }
  });
</script>
</body>
</html>
